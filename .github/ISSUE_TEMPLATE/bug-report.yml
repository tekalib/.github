name: Bug report
description: Signale un bug ou un comportement inattendu
title: '[Bug]: '
type: bug
body:
  - type: markdown
    attributes:
      value: |
        Merci de détailler le bug pour qu'il soit facile à reproduire et corriger.

        Priorité et effort se renseignent ensuite dans la barre latérale de l'issue (champs Priority et Effort).

  - type: textarea
    id: description
    attributes:
      label: Description
      description: Qu'est-ce qui ne fonctionne pas ?
      placeholder: Ex. L'export PDF échoue silencieusement quand le rapport dépasse 50 pages.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Les étapes précises pour reproduire le bug.
      placeholder: |
        1. Aller sur ...
        2. Cliquer sur ...
        3. Observer ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Comportement attendu
      description: Que devrait-il se passer à la place ?
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Sévérité
      options:
        - Critique (bloquant, perte de données)
        - Élevée (fonctionnalité majeure cassée)
        - Moyenne (gênant mais contournable)
        - Faible (cosmétique)
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Contexte additionnel
      description: Logs, captures d'écran, environnement (OS, navigateur, version) (optionnel).
    validations:
      required: false
