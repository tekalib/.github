name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CHECK_JSONSCHEMA: check-jsonschema==0.38.2

jobs:
  verify:
    name: Verify (issue forms · Dependabot schema)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Every repository of the organization inherits these forms: a broken one silently
      # falls back to a blank issue everywhere.
      - run: >-
          find .github/ISSUE_TEMPLATE -name '*.yml' ! -name config.yml
          -exec pipx run "$CHECK_JSONSCHEMA" --builtin-schema vendor.github-issue-forms {} +
      - run: pipx run "$CHECK_JSONSCHEMA" --builtin-schema vendor.github-issue-config .github/ISSUE_TEMPLATE/config.yml
      - run: pipx run "$CHECK_JSONSCHEMA" --builtin-schema vendor.dependabot .github/dependabot.yml

  # The one check the Trunk Merge Flow ruleset requires, same name in every repository: it needs
  # every other job. always(), because a job skipped after a failed need reports success.
  ci-passed:
    name: CI passed
    needs: [verify]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1

  automerge:
    needs: [ci-passed]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]' }}
    uses: tekalib/.workflows/.github/workflows/dependabot-automerge.yml@79652356f97a6498d41d9453be523099e53a7b93 # v1.2.0
    permissions:
      contents: read
      pull-requests: read
    with:
      ci-passed: ${{ needs.ci-passed.result == 'success' }}
    secrets:
      app-key: ${{ secrets.AUTOMATION_APP_KEY }}

  release:
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: tekalib/.workflows/.github/workflows/release.yml@79652356f97a6498d41d9453be523099e53a7b93 # v1.2.0
    permissions:
      contents: write
    with:
      sha: ${{ github.sha }}
